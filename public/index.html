<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Magic - Galactic Design Tool</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- WebGL Canvas Background -->
    <canvas id="webgl-canvas"></canvas>
    
    <!-- Hero Content -->
    <div class="hero-container">
        <div class="hero-content">
            <!-- Status Badge -->
            <div class="status-badge">
                <div class="status-indicator"></div>
                <span>Unicorn.studio is now in open beta!</span>
            </div>
            
            <!-- Main Title -->
            <h1 class="hero-title" id="heroTitle">
                The Design Tool<br>
                for WebGL Magic
            </h1>
            
            <!-- Subtitle -->
            <p class="hero-subtitle">
                Create jaw-dropping motion and interaction in<br>
                minutes — no code. Embed with a few clicks.
            </p>
            
            <!-- CTA Button -->
            <button class="cta-button" id="startCreating">
                <span>Start creating</span>
                <div class="button-glow"></div>
            </button>
        </div>
    </div>

    <!-- Floating Orange Arrows (like in reference) -->
    <div class="floating-arrows">
        <svg class="arrow arrow-1" viewBox="0 0 100 100" fill="none">
            <path d="M20 50 L60 20 L60 35 L80 35 L80 65 L60 65 L60 80 Z" fill="#FF8C00"/>
        </svg>
        
        <svg class="arrow arrow-2" viewBox="0 0 100 100" fill="none">
            <path d="M30 20 L70 50 L30 80 L30 65 L10 65 L10 35 L30 35 Z" fill="#FF8C00"/>
        </svg>
        
        <svg class="arrow arrow-3" viewBox="0 0 100 100" fill="none">
            <path d="M50 20 L80 50 L50 80 L50 65 L20 65 L20 50 L50 35 Z" fill="#FF8C00"/>
        </svg>
        
        <svg class="arrow arrow-4" viewBox="0 0 100 100" fill="none">
            <path d="M20 30 L60 30 L60 15 L80 40 L60 65 L60 50 L20 50 Z" fill="#FF8C00"/>
        </svg>
        
        <svg class="arrow arrow-5" viewBox="0 0 100 100" fill="none">
            <path d="M15 50 L55 20 L55 35 L85 35 L85 65 L55 65 L55 80 Z" fill="#FF8C00"/>
        </svg>
    </div>

    <!-- Scripts -->
    <script src="shader.js"></script>
    <script src="main.js"></script>
</body>
</html>
